version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: school_postgres
    environment:
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: school_db
    ports:
      - "5432:5432"
    volumes:
      - school_pgdata:/var/lib/postgresql/data

volumes:
  school_pgdata:
